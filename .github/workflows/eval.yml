name: AI coach evals

# Live evals call the Anthropic API and cost money (about $0.40 per run of
# the full set), so they run only when started by hand: Actions → AI coach
# evals → Run workflow. Never on a schedule or on pull requests.
# The offline part of the harness runs in ci.yml as part of npm test.

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs per case (more runs give a steadier pass rate)
        type: number
        default: 1
      judge:
        description: Score subjective cases with the LLM judge
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  eval:
    name: Live eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # The evals use fixture users, not the database. The API config still
      # requires these two, so they get placeholder values.
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      JWT_SECRET: ci-jwt-secret-at-least-32-characters
    steps:
      - name: Check the API key secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret to run live evals."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run evals
        env:
          REPEAT: ${{ inputs.repeat }}
          JUDGE_FLAG: ${{ !inputs.judge && '--no-judge' || '' }}
        # An explicit bash shell adds pipefail, so tee keeps the exit code.
        shell: bash
        run: |
          npm run eval -w @habit-tracker/api -- --repeat "$REPEAT" $JUDGE_FLAG \
            | tee eval-output.txt
      - name: Write the job summary
        if: always()
        run: |
          {
            echo '## AI coach evals'
            echo '```'
            tail -n 40 eval-output.txt 2>/dev/null || echo 'No output.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: apps/api/evals/reports
          retention-days: 30
          if-no-files-found: ignore
