name: Claude

# Runs only when the repo owner writes "@claude" in an issue or PR comment.
# Nothing runs on push or when a PR is opened, and other people's mentions are
# ignored, because every run calls the Anthropic API and costs money.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  claude:
    name: Respond to @claude
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name != 'pull_request_review' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sonnet and a turn cap keep a single run cheap. Change per request
          # by asking in the comment; raise here only if runs get cut short.
          claude_args: --model claude-sonnet-5-5 --max-turns 15
