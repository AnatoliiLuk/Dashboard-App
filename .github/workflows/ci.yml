name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  DATABASE_URL: postgresql://habit:habit@localhost:5432/habit_tracker?schema=public
  JWT_SECRET: ci-jwt-secret-at-least-32-characters

jobs:
  check:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: habit
          POSTGRES_PASSWORD: habit
          POSTGRES_DB: habit_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habit -d habit_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: habit
          POSTGRES_PASSWORD: habit
          POSTGRES_DB: habit_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habit -d habit_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: npm ci
      - run: npx prisma generate
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
          retention-days: 7
