openapi: 3.0.3
info:
  title: Habits+ API
  version: 0.1.0
  description: Accounts, habits, daily completions, and the AI coach. Register and login set an httpOnly session cookie. Protected routes accept that cookie or a Bearer token.
servers:
  - url: http://localhost:4000
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Habits
  - name: Completions
  - name: Coach
  - name: MCP
  - name: OAuth
    description: >-
      Authorization for MCP clients (docs/adr/0004-mcp-oauth.md). The OAuth
      2.1 endpoints themselves are served by the MCP SDK at the API root and
      follow their RFCs: /.well-known/oauth-authorization-server (RFC 8414),
      /.well-known/oauth-protected-resource/api/mcp (RFC 9728), /register
      (RFC 7591), /authorize and /token (OAuth 2.1 with PKCE S256), /revoke
      (RFC 7009). Scopes: habits:read, habits:write. Only the consent step
      used by the web app is described here.
paths:
  /health:
    get:
      tags: [Health]
      summary: Process health
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
  /api:
    get:
      tags: [Health]
      summary: API name and version
      responses:
        '200':
          description: Service info
          content:
            application/json:
              schema:
                type: object
                required: [name, version]
                properties:
                  name:
                    type: string
                    example: Habits+ API
                  version:
                    type: string
                    example: 0.1.0
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: Returns the user and sets the habits_plus_token cookie. The token is not in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: Returns the user and sets the habits_plus_token cookie. The token is not in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookie
      responses:
        '204':
          description: Signed out
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Error'
  /api/users/me:
    patch:
      tags: [Users]
      summary: Update the signed-in person's name or email
      description: >-
        Changing the email requires currentPassword; changing only the name
        does not. The email is trimmed and lowercased. Sending the current
        values is a no-op that returns 200. Other sessions stay signed in
        (ADR 0002).
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateBody'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: >-
            Invalid body, neither name nor email given, currentPassword
            missing for an email change, or `Current password is incorrect`.
            Never 401, because clients sign out on any 401.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: '`Email already in use` by another account, in any case'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >-
            More than 5 failed attempts in a minute for this user. Successful
            updates are not counted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Users]
      summary: Delete the signed-in person's account
      description: >-
        Deletes the user and everything that cascades from it in one
        transaction (ADR 0001), then clears the session cookie. Every token
        for the user stops working. There is no undo. Rate limited to 5
        requests per minute per user.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteBody'
      responses:
        '204':
          description: Deleted; the session cookie is cleared
        '400':
          description: Invalid body or incorrect password; the account is kept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/users/me/password:
    post:
      tags: [Users]
      summary: Change the signed-in person's password
      description: >-
        Signs out every other session (ADR 0002). This session gets a new
        token, set as the habits_plus_token cookie and returned in the body
        for Bearer clients. Rate limited to 5 requests per minute per user.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeBody'
      responses:
        '200':
          description: Password changed; new session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: >-
            Invalid body, `Current password is incorrect`, or the new password
            equals the current one. Never 401.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/habits:
    get:
      tags: [Habits]
      summary: List the signed-in user's habits
      description: Each habit includes up to 30 recent completions.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [Habits]
      summary: Create a habit
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/habits/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Habits]
      summary: Get one habit
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Habit, including its completions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [Habits]
      summary: Rename, recolor, archive, or restore a habit
      description: At least one of name, color, or archived is required.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitUpdate'
      responses:
        '200':
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Habits]
      summary: Permanently delete an archived habit
      description: Removes the habit and its completions. Archive the habit first.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/completions:
    get:
      tags: [Completions]
      summary: List the signed-in user's completions
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Completions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Completion'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [Completions]
      summary: Mark a habit done on a date
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/completions/toggle:
    post:
      tags: [Completions]
      summary: Toggle a habit on a date
      description: Creates the completion when it is missing, and deletes it when it already exists.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionBody'
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/completions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Completions]
      summary: Delete a completion
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/coach/chat:
    post:
      tags: [Coach]
      summary: Ask the AI coach
      description: >-
        Sends one new message and returns the coach's next reply. The server
        keeps the conversation: it adds the last saved messages as history and,
        on success, saves the question and the reply. A failed request saves
        nothing, so the client can send the same message again. The coach can read the person's habits and goals but never changes
        them; a suggested habit comes back as a proposal that the client
        creates through POST /api/habits after the person accepts it.
        Limited per user per minute (AI_RATE_LIMIT_PER_MINUTE) and per UTC day
        (AI_DAILY_TOKEN_BUDGET).
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachChatBody'
      responses:
        '200':
          description: The coach's reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachReply'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          description: Too many messages this minute, the daily token budget is used up, or the AI provider is rate limiting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The AI provider failed, or the coach could not finish an answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The coach is turned off (AI_ENABLED=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The AI provider took too long to answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/coach/conversation:
    get:
      tags: [Coach]
      summary: Get the saved coach conversation
      description: >-
        Returns the person's one ongoing conversation, up to the last 20
        messages, oldest first. A conversation with no new message for
        AI_CONVERSATION_RETENTION_DAYS is deleted first, so it comes back
        empty. Not rate limited.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: The conversation, empty when there is none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachConversation'
        '401':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Coach]
      summary: Delete the saved coach conversation
      description: >-
        Permanently deletes the person's conversation and all its messages.
        Succeeds when there is nothing to delete. Not rate limited.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
  /api/coach/usage:
    get:
      tags: [Coach]
      summary: Get today's AI coach token usage
      description: >-
        Billable tokens used today against AI_DAILY_TOKEN_BUDGET, counted
        the same way as the budget check (cache reads left out). The day is
        UTC. Works when the coach is disabled, with enabled false. Not rate
        limited.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Usage for the current UTC day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachUsage'
        '401':
          $ref: '#/components/responses/Error'
  /api/mcp:
    post:
      tags: [MCP]
      summary: Model Context Protocol endpoint (Streamable HTTP)
      description: >-
        JSON-RPC 2.0 messages from an MCP client (initialize, tools/list,
        tools/call, resources/read, prompts/get). Stateless: no
        Mcp-Session-Id, every request is answered with application/json.
        Clients must send Accept: application/json, text/event-stream. Bearer
        token only (an OAuth access token, or a personal JWT with every
        scope); the session cookie is refused. Tools outside the token's
        scopes are not listed. Tools, resources and the prompt are described
        in docs/MCP_PLAN.md. Rate limited per user by
        MCP_RATE_LIMIT_PER_MINUTE.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request or notification.
      responses:
        '200':
          description: JSON-RPC response. Tool failures come back as results with isError true.
          content:
            application/json:
              schema:
                type: object
        '202':
          description: Notification accepted (no response body)
        '401':
          description: >-
            Missing or invalid Bearer token. WWW-Authenticate points to the
            protected resource metadata, where clients find the OAuth server.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer resource_metadata="http://localhost:4000/.well-known/oauth-protected-resource/api/mcp"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
        '406':
          description: Accept header does not allow application/json and text/event-stream
        '429':
          $ref: '#/components/responses/Error'
    get:
      tags: [MCP]
      summary: Server-to-client stream (not supported)
      description: Stateless mode has no server-initiated stream. Always 405.
      security:
        - bearerAuth: []
      responses:
        '405':
          description: Method not allowed. Allow is POST.
    delete:
      tags: [MCP]
      summary: End a session (not supported)
      description: Stateless mode has no session to end. Always 405.
      security:
        - bearerAuth: []
      responses:
        '405':
          description: Method not allowed. Allow is POST.
  /api/oauth/consent:
    get:
      tags: [OAuth]
      summary: Describe a pending MCP authorization
      description: >-
        For the web consent page. `request` is the signed, 10-minute value
        that /authorize put in the consent page URL. Client name and URI are
        self-declared by the client.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: request
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: What the client asks for
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthConsentRequest'
        '400':
          description: Missing, edited or expired request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [OAuth]
      summary: Approve or deny a pending MCP authorization
      description: >-
        Approving issues a single-use authorization code (10 minutes) for the
        signed-in user. Either way the response is the client's redirect URI
        with `code` or `error=access_denied`, plus `state` and `iss`; the web
        app sends the browser there.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request, approve]
              properties:
                request:
                  type: string
                approve:
                  type: boolean
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required: [redirectTo]
                properties:
                  redirectTo:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Rejected with 401 when the user no longer exists or the password changed after the token was issued.
    cookieAuth:
      type: apiKey
      in: cookie
      name: habits_plus_token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OAuthConsentRequest:
      type: object
      required: [clientName, clientUri, redirectHost, scopes]
      properties:
        clientName:
          type: string
          nullable: true
        clientUri:
          type: string
          nullable: true
        redirectHost:
          type: string
          example: claude.ai
        scopes:
          type: array
          items:
            type: string
            enum: [habits:read, habits:write]
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          description: English, for logs and developers. May change; clients must not match on it.
        code:
          type: string
          description: Stable machine-readable error code. Present only on errors that clients handle specifically.
          enum:
            - CURRENT_PASSWORD_REQUIRED
            - CURRENT_PASSWORD_INCORRECT
            - PASSWORD_UNCHANGED
            - EMAIL_IN_USE
            - RATE_LIMITED
    RegisterBody:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased before it is stored.
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Case-insensitive; trimmed and lowercased before lookup.
        password:
          type: string
          minLength: 1
    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
    Profile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [createdAt]
          properties:
            createdAt:
              type: string
              format: date-time
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/Profile'
    ProfileUpdateBody:
      type: object
      description: At least one of name or email.
      anyOf:
        - required: [name]
        - required: [email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; a name of only spaces is rejected.
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased before it is stored.
        currentPassword:
          type: string
          minLength: 1
          description: Required when email changes.
    PasswordChangeBody:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: Must differ from the current password.
    AccountDeleteBody:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The new session token, also set as the cookie.
    CoachUsage:
      type: object
      required: [enabled, usedTokens, dailyLimit, resetsAt]
      properties:
        enabled:
          type: boolean
          description: False when AI_ENABLED is false.
        usedTokens:
          type: integer
          minimum: 0
          description: Billable tokens used today; cache reads left out.
        dailyLimit:
          type: integer
          minimum: 0
          description: AI_DAILY_TOKEN_BUDGET.
        resetsAt:
          type: string
          format: date-time
          description: Next midnight UTC.
    HabitColor:
      type: string
      enum: [sky, green, amber, rose, violet, teal]
    HabitCreate:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          $ref: '#/components/schemas/HabitColor'
    HabitUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          $ref: '#/components/schemas/HabitColor'
        archived:
          type: boolean
    Habit:
      type: object
      required: [id, name, color, userId, archivedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          $ref: '#/components/schemas/HabitColor'
        userId:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completions:
          type: array
          items:
            $ref: '#/components/schemas/Completion'
    CompletionBody:
      type: object
      required: [habitId, date]
      properties:
        habitId:
          type: string
          minLength: 1
        date:
          type: string
          description: Calendar date
          example: '2026-10-09'
    Completion:
      type: object
      required: [id, habitId, userId, completedAt, createdAt]
      properties:
        id:
          type: string
        habitId:
          type: string
        userId:
          type: string
        completedAt:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    ToggleResult:
      type: object
      required: [completed, completion]
      properties:
        completed:
          type: boolean
        completion:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Completion'
    CoachMessage:
      type: object
      required: [id, role, content, truncated, proposal]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: Plain text. Render it as text, not HTML.
        truncated:
          type: boolean
          description: Always false for user messages
        proposal:
          type: object
          nullable: true
          description: The habit proposal shown with an assistant reply
          allOf:
            - $ref: '#/components/schemas/HabitProposal'
    CoachConversation:
      type: object
      required: [messages, retentionDays]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/CoachMessage'
        retentionDays:
          type: integer
          description: Days without a new message before the conversation is deleted
          example: 30
    CoachChatBody:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          description: The new message. Earlier turns come from the saved conversation.
          minLength: 1
          maxLength: 2000
        locale:
          type: string
          enum: [en, uk]
          default: en
        today:
          type: string
          description: The person's local date, so streaks match the UI. Must be within one day of the server's UTC date. Defaults to the server date.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-10-26'
    HabitProposal:
      type: object
      required: [name, color, reason]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          $ref: '#/components/schemas/HabitColor'
        reason:
          type: string
          minLength: 1
          maxLength: 300
    CoachReply:
      type: object
      required: [reply, truncated, proposal]
      properties:
        reply:
          type: string
          description: Plain text. Render it as text, not HTML.
        truncated:
          type: boolean
          description: True when the reply hit the output token limit and was cut off
        proposal:
          type: object
          nullable: true
          description: A habit the coach suggests. Nothing is saved until the client creates it.
          allOf:
            - $ref: '#/components/schemas/HabitProposal'
