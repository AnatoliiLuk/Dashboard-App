openapi: 3.0.3
info:
  title: Habits+ API
  version: 0.1.0
  description: Accounts, habits, and daily completions. Protected routes need a Bearer token from register or login.
servers:
  - url: http://localhost:4000
tags:
  - name: Health
  - name: Auth
  - name: Habits
  - name: Completions
paths:
  /health:
    get:
      tags: [Health]
      summary: Process health
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
  /api:
    get:
      tags: [Health]
      summary: API name and version
      responses:
        '200':
          description: Service info
          content:
            application/json:
              schema:
                type: object
                required: [name, version]
                properties:
                  name:
                    type: string
                    example: Habits+ API
                  version:
                    type: string
                    example: 0.1.0
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Error'
  /api/habits:
    get:
      tags: [Habits]
      summary: List the signed-in user's habits
      description: Each habit includes up to 30 recent completions.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [Habits]
      summary: Create a habit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/habits/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Habits]
      summary: Get one habit
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Habit, including its completions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [Habits]
      summary: Rename a habit or change its color
      description: At least one of name or color is required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitUpdate'
      responses:
        '200':
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Habits]
      summary: Delete a habit
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/completions:
    get:
      tags: [Completions]
      summary: List the signed-in user's completions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Completions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Completion'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [Completions]
      summary: Mark a habit done on a date
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/completions/toggle:
    post:
      tags: [Completions]
      summary: Toggle a habit on a date
      description: Creates the completion when it is missing, and deletes it when it already exists.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionBody'
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/completions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Completions]
      summary: Delete a completion
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
    RegisterBody:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
    Profile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [createdAt]
          properties:
            createdAt:
              type: string
              format: date-time
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
    HabitColor:
      type: string
      enum: [sky, green, amber, rose, violet, teal]
    HabitCreate:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          $ref: '#/components/schemas/HabitColor'
    HabitUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          $ref: '#/components/schemas/HabitColor'
    Habit:
      type: object
      required: [id, name, color, userId, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          $ref: '#/components/schemas/HabitColor'
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completions:
          type: array
          items:
            $ref: '#/components/schemas/Completion'
    CompletionBody:
      type: object
      required: [habitId, date]
      properties:
        habitId:
          type: string
          minLength: 1
        date:
          type: string
          description: Calendar date
          example: '2026-10-09'
    Completion:
      type: object
      required: [id, habitId, userId, completedAt, createdAt]
      properties:
        id:
          type: string
        habitId:
          type: string
        userId:
          type: string
        completedAt:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    ToggleResult:
      type: object
      required: [completed, completion]
      properties:
        completed:
          type: boolean
        completion:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Completion'
