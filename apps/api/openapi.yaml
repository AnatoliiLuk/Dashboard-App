openapi: 3.0.3
info:
  title: Habits+ API
  version: 0.1.0
  description: Accounts, habits, daily completions, and the AI coach. Register and login set an httpOnly session cookie. Protected routes accept that cookie or a Bearer token.
servers:
  - url: http://localhost:4000
tags:
  - name: Health
  - name: Auth
  - name: Habits
  - name: Completions
  - name: Coach
paths:
  /health:
    get:
      tags: [Health]
      summary: Process health
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
  /api:
    get:
      tags: [Health]
      summary: API name and version
      responses:
        '200':
          description: Service info
          content:
            application/json:
              schema:
                type: object
                required: [name, version]
                properties:
                  name:
                    type: string
                    example: Habits+ API
                  version:
                    type: string
                    example: 0.1.0
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: Returns the user and sets the habits_plus_token cookie. The token is not in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: Returns the user and sets the habits_plus_token cookie. The token is not in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookie
      responses:
        '204':
          description: Signed out
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Error'
  /api/habits:
    get:
      tags: [Habits]
      summary: List the signed-in user's habits
      description: Each habit includes up to 30 recent completions.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [Habits]
      summary: Create a habit
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/habits/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Habits]
      summary: Get one habit
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Habit, including its completions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [Habits]
      summary: Rename, recolor, archive, or restore a habit
      description: At least one of name, color, or archived is required.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitUpdate'
      responses:
        '200':
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Habits]
      summary: Permanently delete an archived habit
      description: Removes the habit and its completions. Archive the habit first.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/completions:
    get:
      tags: [Completions]
      summary: List the signed-in user's completions
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Completions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Completion'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [Completions]
      summary: Mark a habit done on a date
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/completions/toggle:
    post:
      tags: [Completions]
      summary: Toggle a habit on a date
      description: Creates the completion when it is missing, and deletes it when it already exists.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionBody'
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/completions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Completions]
      summary: Delete a completion
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/coach/chat:
    post:
      tags: [Coach]
      summary: Ask the AI coach
      description: >-
        Sends one new message and returns the coach's next reply. The server
        keeps the conversation: it adds the last saved messages as history and,
        on success, saves the question and the reply. A failed request saves
        nothing, so the client can send the same message again. The coach can read the person's habits and goals but never changes
        them; a suggested habit comes back as a proposal that the client
        creates through POST /api/habits after the person accepts it.
        Limited per user per minute (AI_RATE_LIMIT_PER_MINUTE) and per UTC day
        (AI_DAILY_TOKEN_BUDGET).
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachChatBody'
      responses:
        '200':
          description: The coach's reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachReply'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          description: Too many messages this minute, the daily token budget is used up, or the AI provider is rate limiting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The AI provider failed, or the coach could not finish an answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The coach is turned off (AI_ENABLED=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The AI provider took too long to answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/coach/conversation:
    get:
      tags: [Coach]
      summary: Get the saved coach conversation
      description: >-
        Returns the person's one ongoing conversation, up to the last 20
        messages, oldest first. A conversation with no new message for
        AI_CONVERSATION_RETENTION_DAYS is deleted first, so it comes back
        empty. Not rate limited.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: The conversation, empty when there is none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachConversation'
        '401':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Coach]
      summary: Delete the saved coach conversation
      description: >-
        Permanently deletes the person's conversation and all its messages.
        Succeeds when there is nothing to delete. Not rate limited.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: habits_plus_token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
    RegisterBody:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
    Profile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [createdAt]
          properties:
            createdAt:
              type: string
              format: date-time
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    HabitColor:
      type: string
      enum: [sky, green, amber, rose, violet, teal]
    HabitCreate:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          $ref: '#/components/schemas/HabitColor'
    HabitUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          $ref: '#/components/schemas/HabitColor'
        archived:
          type: boolean
    Habit:
      type: object
      required: [id, name, color, userId, archivedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          $ref: '#/components/schemas/HabitColor'
        userId:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completions:
          type: array
          items:
            $ref: '#/components/schemas/Completion'
    CompletionBody:
      type: object
      required: [habitId, date]
      properties:
        habitId:
          type: string
          minLength: 1
        date:
          type: string
          description: Calendar date
          example: '2026-10-09'
    Completion:
      type: object
      required: [id, habitId, userId, completedAt, createdAt]
      properties:
        id:
          type: string
        habitId:
          type: string
        userId:
          type: string
        completedAt:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    ToggleResult:
      type: object
      required: [completed, completion]
      properties:
        completed:
          type: boolean
        completion:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Completion'
    CoachMessage:
      type: object
      required: [id, role, content, truncated, proposal]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: Plain text. Render it as text, not HTML.
        truncated:
          type: boolean
          description: Always false for user messages
        proposal:
          type: object
          nullable: true
          description: The habit proposal shown with an assistant reply
          allOf:
            - $ref: '#/components/schemas/HabitProposal'
    CoachConversation:
      type: object
      required: [messages, retentionDays]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/CoachMessage'
        retentionDays:
          type: integer
          description: Days without a new message before the conversation is deleted
          example: 30
    CoachChatBody:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          description: The new message. Earlier turns come from the saved conversation.
          minLength: 1
          maxLength: 2000
        locale:
          type: string
          enum: [en, uk]
          default: en
        today:
          type: string
          description: The person's local date, so streaks match the UI. Must be within one day of the server's UTC date. Defaults to the server date.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-10-26'
    HabitProposal:
      type: object
      required: [name, color, reason]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          $ref: '#/components/schemas/HabitColor'
        reason:
          type: string
          minLength: 1
          maxLength: 300
    CoachReply:
      type: object
      required: [reply, truncated, proposal]
      properties:
        reply:
          type: string
          description: Plain text. Render it as text, not HTML.
        truncated:
          type: boolean
          description: True when the reply hit the output token limit and was cut off
        proposal:
          type: object
          nullable: true
          description: A habit the coach suggests. Nothing is saved until the client creates it.
          allOf:
            - $ref: '#/components/schemas/HabitProposal'
