services:
  postgres:
    image: postgres:15
    container_name: habit-tracker-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
      POSTGRES_DB: habit_tracker
    volumes:
      - habit_tracker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U habit -d habit_tracker']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  habit_tracker_pg:
